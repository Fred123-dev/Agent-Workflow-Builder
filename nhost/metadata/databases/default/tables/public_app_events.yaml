table:
  schema: public
  name: app_events
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, event_type, payload, created_at]
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: user
    permission:
      columns: [org_id, event_type, payload]
      check:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in: [owner, editor]
event_triggers:
  - name: app_events_db_trigger
    definition:
      enable_manual: false
      insert:
        columns: '*'
    webhook: '{{ACTIONS_BASE_URL}}/dbEventStart'
    headers:
      - name: x-action-secret
        value_from_env: ACTION_SECRET
    retry_conf:
      num_retries: 1
      interval_sec: 10
      timeout_sec: 30
