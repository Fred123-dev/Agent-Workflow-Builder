table:
  schema: public
  name: org_usage_this_month
select_permissions:
  - role: user
    permission:
      columns: [org_id, quota_calls_allowed, quota_calls_used, avg_run_duration_seconds]
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: organizations
        column_mapping:
          org_id: id
