table:
  schema: public
  name: workflows
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_steps
  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_triggers
  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_runs
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, name, description, created_by, created_at, updated_at]
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  # owner + editor can create workflows; viewers cannot (Layer 1)
  - role: user
    permission:
      columns: [org_id, name, description, created_by]
      check:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in: [owner, editor]
      set:
        created_by: x-hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns: [name, description, updated_at]
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _in: [owner, editor]
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
