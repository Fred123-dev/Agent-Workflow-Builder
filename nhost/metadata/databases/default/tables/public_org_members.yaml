table:
  schema: public
  name: org_members
object_relationships:
  - name: org
    using:
      foreign_key_constraint_on: org_id
  - name: user
    using:
      foreign_key_constraint_on: user_id
select_permissions:
  - role: user
    permission:
      columns: [id, org_id, user_id, role, created_at]
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  # Only an org owner can add members (invite/promote/demote handled as
  # insert + update by the same rule set).
  - role: user
    permission:
      check:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
      columns: [org_id, user_id, role]
update_permissions:
  - role: user
    permission:
      columns: [role]
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
            role:
              _eq: owner
