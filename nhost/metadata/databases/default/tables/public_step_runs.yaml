table:
  schema: public
  name: step_runs
object_relationships:
  - name: workflow_run
    using:
      foreign_key_constraint_on: workflow_run_id
  - name: workflow_step
    using:
      foreign_key_constraint_on: workflow_step_id
select_permissions:
  - role: user
    permission:
      columns:
        [id, workflow_run_id, org_id, workflow_step_id, status, input, output,
         error, attempt_count, approved_by, approved_at, started_at, finished_at]
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  # Implements the "notify" step type as an Event Trigger: whenever a
  # step_run's status flips to succeeded, the webhook inspects the parent
  # step's type and only actually sends a Slack/email alert when it's
  # 'notify' — cheaper than a dedicated trigger per notify step, and keeps
  # the Action handler itself simple (it just writes status, same as any
  # other step type).
  - name: step_runs_notify_dispatch
    definition:
      enable_manual: false
      update:
        columns: [status]
    webhook: '{{ACTIONS_BASE_URL}}/notifyDispatch'
    headers:
      - name: x-action-secret
        value_from_env: ACTION_SECRET
    retry_conf:
      num_retries: 2
      interval_sec: 10
      timeout_sec: 30
