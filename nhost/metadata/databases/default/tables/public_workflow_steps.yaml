table:
  schema: public
  name: workflow_steps
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: org
    using:
      foreign_key_constraint_on: org_id
select_permissions:
  - role: user
    permission:
      columns: [id, workflow_id, org_id, step_order, type, name, config, created_at]
      filter:
        org:
          members:
            user_id:
              _eq: X-Hasura-User-Id
insert_permissions:
  # Layer 1 (org+role scoping) AND Layer 2 (step-type gating) in one rule:
  # owners may insert any step type; editors may insert any type EXCEPT
  # db_write, which reaches outside the sandbox and is owner-only.
  - role: user
    permission:
      columns: [workflow_id, step_order, type, name, config]
      check:
        _or:
          - workflow:
              org:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  role:
                    _eq: owner
          - _and:
              - workflow:
                  org:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
                      role:
                        _eq: editor
              - type:
                  _nin: [db_write, notify]
update_permissions:
  - role: user
    permission:
      columns: [step_order, name, config]
      filter:
        _or:
          - workflow:
              org:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  role:
                    _eq: owner
          - _and:
              - workflow:
                  org:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
                      role:
                        _eq: editor
              - type:
                  _nin: [db_write, notify]
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - workflow:
              org:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
                  role:
                    _eq: owner
          - _and:
              - workflow:
                  org:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
                      role:
                        _eq: editor
              - type:
                  _nin: [db_write, notify]
