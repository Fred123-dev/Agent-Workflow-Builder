# nhost project config — created by `nhost init`, edit as needed.
[hasura]
version = "v2.36.0"
adminSecret = "%{HASURA_ADMIN_SECRET}"

[[hasura.jwtSecrets]]
type = "HS256"
key = "{{ secrets.NHOST_JWT_SECRET }}"

[auth]
version = "0.32.0"

[functions]
# functions/ is served at https://<subdomain>.functions.<region>.nhost.run/v1/
[functions.node]
version = 22
